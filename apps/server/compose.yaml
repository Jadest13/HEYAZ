services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: heyaz
      POSTGRES_USER: heyaz
      POSTGRES_PASSWORD: heyaz
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - heyaz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heyaz -d heyaz']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  heyaz-postgres:
